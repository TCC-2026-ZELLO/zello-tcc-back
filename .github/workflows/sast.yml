name: 'SAST - Security Scans'

on:
  push:
    branches: ['develop', 'main']
  pull_request:
    branches: ['develop', 'main']
  schedule:
    # Executa toda segunda-feira às 03:00 UTC (00:00 BRT)
    - cron: '0 3 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  semgrep:
    name: Semgrep OSS
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Executar análise do Semgrep
        # O scan gera um arquivo padronizado no formato SARIF
        run: semgrep scan --config auto --sarif --output=semgrep.sarif
        env:
          SEMGREP_RULES: >-
            p/default
            p/owasp-top-ten
            p/typescript
            p/javascript
            p/react
            p/nodejs

      - name: Publicar resultados do Semgrep no GitHub Security
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        if: always() # Garante envio mesmo se vulnerabilidades forem encontradas
        with:
          sarif_file: semgrep.sarif

  codeql:
    name: GitHub CodeQL
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Inicializar CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          languages: 'javascript-typescript'
          queries: security-extended,security-and-quality

      - name: Executar análise do CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4
        with:
          category: '/language:javascript-typescript'

  # v5.0.0-15.2.1: auditoria de dependências (SCA). Falha o pipeline com
  # vulnerabilidade alta ou crítica em dependência de produção.
  sca:
    name: SCA - npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configurar Node.js 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: npm audit (produção) com gate de risco aceito
        # Falha com crítica ou alta fora da lista documentada em scripts/audit-gate.mjs.
        run: node scripts/audit-gate.mjs

  # v5.0.0-13.3.1: nenhum segredo versionado no repositório nem no histórico.
  secrets:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório (histórico completo)
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      # CLI oficial do Gitleaks (licença MIT). A gitleaks-action exige licença
      # paga para repositórios de organização, por isso não é usada.
      - name: Executar Gitleaks (histórico completo)
        run: >-
          docker run --rm -v "${{ github.workspace }}:/repo" --entrypoint sh
          ghcr.io/gitleaks/gitleaks:v8.24.0 -c
          "git config --global --add safe.directory /repo &&
          gitleaks git /repo --redact --verbose --exit-code 1"

  # v5.0.0-1.3.2 / 1.2.5: regras de segurança do ESLint (eval, child_process,
  # ReDoS, require dinâmico).
  eslint-security:
    name: ESLint Security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Configurar Node.js 20
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci --ignore-scripts
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'

      - name: ESLint (somente regras de segurança)
        run: >-
          npx eslint "src/**/*.ts" --no-inline-config
          --rule '{"@typescript-eslint/no-unsafe-member-access":"off","@typescript-eslint/no-unsafe-call":"off","@typescript-eslint/no-unsafe-assignment":"off","@typescript-eslint/no-unsafe-return":"off","@typescript-eslint/no-unsafe-argument":"off","@typescript-eslint/require-await":"off","@typescript-eslint/no-unused-vars":"off","@typescript-eslint/no-unnecessary-type-assertion":"off","@typescript-eslint/no-wrapper-object-types":"off","@typescript-eslint/unbound-method":"off","@typescript-eslint/no-floating-promises":"off","prettier/prettier":"off"}'
